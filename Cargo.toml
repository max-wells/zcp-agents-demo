[package]
name = "zcp-agents-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9", default-features = false, features = [
    "migrate",
    "macros",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls",
    "uuid",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
